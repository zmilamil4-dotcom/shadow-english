name: echo_speak
description: EchoSpeak - practice English speaking and pronunciation.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_tts: ^4.0.2
  record: ^5.1.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  video_player: ^2.9.2
  camera: ^0.11.0+2
  google_mlkit_text_recognition: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B0B1F"
  adaptive_icon_foreground: "assets/icon/icon.png"
